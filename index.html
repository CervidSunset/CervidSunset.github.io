<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cozy Fishing XR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // Component to ensure WebXR AR / Passthrough initializes cleanly
    AFRAME.registerComponent('xr-passthrough-setup', {
      init: function () {
        const sceneEl = this.el;
        sceneEl.addEventListener('enter-vr', () => {
          if (sceneEl.is('ar-mode')) {
            // Ensure clear background for mixed reality passthrough
            sceneEl.renderer.setClearColor('#000000', 0);
          }
        });
      }
    });

    // Simple interaction listener for pinch / hand tracking gestures
    AFRAME.registerComponent('pinch-listener', {
      schema: { hand: { type: 'string', default: 'right' } },
      init: function () {
        this.el.addEventListener('pinchstarted', (evt) => {
          console.log(`${this.data.hand} hand pinched at:`, evt.detail.position);
          // Insert cast / reel / interaction logic here
        });
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">
  <a-scene
    xr-passthrough-setup
    webxr="optionalFeatures: hit-test, local-floor, hand-tracking; overlayElement: #overlay;"
    renderer="alpha: true; antialias: true; colorManagement: true;"
    embedded>

    <a-assets>
      <!-- Fishing hole GLB asset -->
      <a-asset-item id="fishingHoleModel" src="models/fishing_hole.glb"></a-asset-item>
    </a-assets>

    <!-- Lighting suitable for mixed reality overlays -->
    <a-entity light="type: ambient; intensity: 0.8;"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; position: 1 4 2"></a-entity>

    <!-- Option 1: Stationary Camera Rig (Locomotion/WASD stripped) -->
    <a-entity id="rig" position="0 0 0">
      <a-camera 
        id="camera" 
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false"
        position="0 1.6 0">
      </a-camera>

      <!-- Meta Quest 3 Hand Tracking -->
      <a-entity 
        id="leftHand" 
        hand-tracking-controls="hand: left; modelStyle: mesh;"
        pinch-listener="hand: left">
      </a-entity>
      <a-entity 
        id="rightHand" 
        hand-tracking-controls="hand: right; modelStyle: mesh;"
        pinch-listener="hand: right">
      </a-entity>
    </a-entity>

    <!-- Stationary Target: Placed on the floor directly in front of the locked origin -->
    <a-entity 
      id="fishingHole" 
      gltf-model="#fishingHoleModel" 
      position="0 0 -1.2" 
      rotation="0 0 0" 
      scale="1 1 1">
    </a-entity>

  </a-scene>
</body>
</html>
