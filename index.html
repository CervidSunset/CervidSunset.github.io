<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MR Fishing Multitasker</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // 1. SPATIAL GRAB INTERACTOR (Works for both Controllers and Hands)
      AFRAME.registerComponent('grab-interact', {
        init: function () {
          this.grabbedEl = null;
          this.worldPos = new THREE.Vector3();
          this.worldQuat = new THREE.Quaternion();

          const grab = () => {
            if (this.grabbedEl) return;
            // Find closest grabbable object
            const grabbables = document.querySelectorAll('.grabbable');
            let closest = null;
            let closestDist = 0.2; // 20cm grab radius

            this.el.object3D.getWorldPosition(this.worldPos);

            grabbables.forEach(el => {
              const elPos = new THREE.Vector3();
              el.object3D.getWorldPosition(elPos);
              const dist = this.worldPos.distanceTo(elPos);
              if (dist < closestDist) {
                closestDist = dist;
                closest = el;
              }
            });

            if (closest) {
              this.grabbedEl = closest;
              // If it's a button, click it instead of holding it
              if (this.grabbedEl.classList.contains('button')) {
                this.grabbedEl.emit('click');
                this.grabbedEl = null;
              }
            }
          };

          const release = () => {
            this.grabbedEl = null;
          };

          // Listeners for controllers and hand tracking pinch
          this.el.addEventListener('triggerdown', grab);
          this.el.addEventListener('pinchstarted', grab);
          this.el.addEventListener('triggerup', release);
          this.el.addEventListener('pinchended', release);
        },
        tick: function () {
          // Keep grabbed object snapped to hand position/rotation
          if (this.grabbedEl) {
            this.el.object3D.getWorldPosition(this.worldPos);
            this.el.object3D.getWorldQuaternion(this.worldQuat);
            
            this.grabbedEl.object3D.position.copy(this.worldPos);
            // Optional: apply rotation. We'll leave it out for the pond so it stays flat, 
            // but apply it if it's the rod.
            if (this.grabbedEl.id === 'fishing-rod') {
              this.grabbedEl.object3D.quaternion.copy(this.worldQuat);
              // Rotate 90 degrees so it points out from the hand like a real rod
              this.grabbedEl.object3D.rotateX(-Math.PI / 2);
            }
          }
        }
      });

      // 2. POND HEIGHT UI CONTROLS
      AFRAME.registerComponent('pond-ui', {
        init: function () {
          const pond = document.querySelector('#pond-container');
          const upBtn = this.el.querySelector('.up-btn');
          const downBtn = this.el.querySelector('.down-btn');
          const lockBtn = this.el.querySelector('.lock-btn');

          upBtn.addEventListener('click', () => { pond.object3D.position.y += 0.05; });
          downBtn.addEventListener('click', () => { pond.object3D.position.y -= 0.05; });
          
          lockBtn.addEventListener('click', () => {
            const isLocked = !pond.classList.contains('grabbable');
            if (isLocked) {
              pond.classList.add('grabbable');
              lockBtn.setAttribute('color', '#ff4444'); // Red = unlocked/moveable
            } else {
              pond.classList.remove('grabbable');
              lockBtn.setAttribute('color', '#44ff44'); // Green = locked
            }
          });
        }
      });

      // 3. BAREBONES FISHING MECHANIC
      AFRAME.registerComponent('fishing-mechanic', {
        init: function() {
          this.bobber = document.querySelector('#bobber');
          this.pond = document.querySelector('#pond-container');
          this.state = 'idle'; // idle, fishing, bite
          this.biteTimer = 0;
          this.rodTipPos = new THREE.Vector3();
          this.pondPos = new THREE.Vector3();
        },
        tick: function(time, timeDelta) {
          const rodEl = this.el;
          
          // Calculate rod tip position (top of the cylinder)
          rodEl.object3D.getWorldPosition(this.rodTipPos);
          const tipOffset = new THREE.Vector3(0, 0.5, 0); // half length of rod
          tipOffset.applyQuaternion(rodEl.object3D.quaternion);
          this.rodTipPos.add(tipOffset);

          this.pond.object3D.getWorldPosition(this.pondPos);

          // Simulate line/bobber dropping straight down from tip
          const dropDepth = Math.max(this.pondPos.y, this.rodTipPos.y - 1.5); // string length
          
          // Draw the string (using A-Frame's line component dynamically)
          rodEl.sceneEl.setAttribute('line', `start: ${this.rodTipPos.x} ${this.rodTipPos.y} ${this.rodTipPos.z}; end: ${this.rodTipPos.x} ${dropDepth} ${this.rodTipPos.z}; color: white`);
          
          // Update bobber visual position
          this.bobber.object3D.position.set(this.rodTipPos.x, dropDepth, this.rodTipPos.z);

          // Check if bobber is in the pond water
          const distToPondCenter = Math.sqrt(
            Math.pow(this.rodTipPos.x - this.pondPos.x, 2) + 
            Math.pow(this.rodTipPos.z - this.pondPos.z, 2)
          );

          const inWater = (distToPondCenter < 0.6 && dropDepth <= this.pondPos.y + 0.1);

          if (inWater && this.state === 'idle') {
            this.state = 'fishing';
            this.biteTimer = time + 10000 + Math.random() * 20000; // 10 seconds to 20 seconds wait
            this.bobber.setAttribute('color', '#ffffff');
          } else if (!inWater) {
            this.state = 'idle';
            this.bobber.setAttribute('color', '#ff0000'); // red when out of water
          }

          // Trigger a bite
          if (this.state === 'fishing' && time > this.biteTimer) {
            this.state = 'bite';
            this.bobber.setAttribute('color', '#00ff00'); // turns green on bite
            this.biteTimer = time + 60000; // 60 seconds to pull up
          }

          // Missed the fish
          if (this.state === 'bite' && time > this.biteTimer) {
            this.state = 'idle';
            this.biteTimer = time + 5000; // cooldown
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- webxr="mode: ar" forces Passthrough background -->
    <a-scene webxr="optionalFeatures: hand-tracking; mode: ar">
      
      <a-assets>
        <!-- Place your actual GLB here. The code falls back to the cylinder behind it if missing -->
        <a-asset-item id="pond-model" src="fishing_hole.glb"></a-asset-item>
      </a-assets>

      <!-- DUAL INPUT HANDLERS -->
      <a-entity id="left-hand" 
                oculus-touch-controls="hand: left" 
                hand-tracking-controls="hand: left" 
                grab-interact>
      </a-entity>
      <a-entity id="right-hand" 
                oculus-touch-controls="hand: right" 
                hand-tracking-controls="hand: right" 
                grab-interact>
      </a-entity>

      <!-- FISHING POND (Grabbable to place it initially) -->
      <!-- Starts slightly in front of user and down. -->
      <a-entity id="pond-container" class="grabbable" position="0 0.1 -1">
        <!-- Visual Pond (Fallback shape) -->
        <a-cylinder radius="0.7" height="0.1" color="#1a66ff" opacity="0.8"></a-cylinder>
        <a-ring radius-inner="0.7" radius-outer="0.8" color="#654321" rotation="-90 0 0"></a-ring>
        <!-- Try to load 3D model if it exists -->
        <a-entity gltf-model="#pond-model" scale="1 1 1" position="0 0 0"></a-entity>
        
        <!-- POND UI: Floating control panel attached to the pond -->
        <a-entity id="pond-ui-panel" pond-ui position="0 0.5 0" rotation="0 0 0">
          <a-box class="grabbable button up-btn" position="-0.2 0 0" scale="0.1 0.1 0.05" color="#aaaaaa">
            <a-text value="UP" align="center" position="0 0 0.6" scale="2 2 2"></a-text>
          </a-box>
          <a-box class="grabbable button lock-btn" position="0 0 0" scale="0.1 0.1 0.05" color="#ff4444">
            <a-text value="LOCK" align="center" position="0 0 0.6" scale="2 2 2"></a-text>
          </a-box>
          <a-box class="grabbable button down-btn" position="0.2 0 0" scale="0.1 0.1 0.05" color="#aaaaaa">
            <a-text value="DOWN" align="center" position="0 0 0.6" scale="2 2 2"></a-text>
          </a-box>
        </a-entity>
      </a-entity>

      <!-- FISHING ROD (Grabbable, stays where dropped) -->
      <a-entity id="fishing-rod" class="grabbable" position="0.5 1 -0.5" rotation="0 0 0" fishing-mechanic>
        <!-- The rod itself -->
        <a-cylinder radius="0.02" height="1.0" color="#8B4513" position="0 0 0"></a-cylinder>
        <!-- Handle -->
        <a-cylinder radius="0.025" height="0.3" color="#111111" position="0 -0.35 0"></a-cylinder>
      </a-entity>

      <!-- BOBBER (Visual only, logic is handled in the rod's script) -->
      <a-sphere id="bobber" radius="0.04" color="#ff0000"></a-sphere>

    </a-scene>
  </body>
</html>
