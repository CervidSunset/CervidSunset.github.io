<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>WebXR Stationary Fishing</title>
    <meta name="description" content="Stationary Mixed Reality Fishing Prototype for Meta Quest 3">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // Simple passive fishing state manager
      AFRAME.registerComponent('fishing-spot', {
        init: function () {
          this.isFishHooked = false;
          this.el.addEventListener('click', () => {
            if (!this.isFishHooked) {
              console.log('Line cast! Waiting for bite...');
              // Simulate passive bite after 4 seconds
              setTimeout(() => {
                this.isFishHooked = true;
                this.el.setAttribute('material', 'color', '#4ade80');
                console.log('Fish hooked! Reeling in...');
              }, 4000);
            } else {
              console.log('Fish caught!');
              this.isFishHooked = false;
              this.el.setAttribute('material', 'color', '#0284c7');
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- Configured for Meta Quest 3 passthrough and stationary local-floor tracking -->
    <a-scene 
      webxr="optionalFeatures: hit-test, local-floor; referenceSpaceType: local-floor"
      renderer="alpha: true; antialias: true;">
      
      <a-assets>
        <!-- Place your fishing hole GLB asset here -->
        <a-asset-item id="fishingHoleModel" src="models/fishing_hole.glb"></a-asset-item>
      </a-assets>

      <!-- Fixed Stationary Camera Rig -->
      <a-entity id="rig" position="0 0 0">
        <!-- Head camera: thumbstick/WASD locomotion disabled, natural 6DoF head movement intact -->
        <a-camera 
          id="head" 
          look-controls="pointerLockEnabled: false" 
          wasd-controls="enabled: false">
          <a-cursor 
            position="0 0 -1" 
            geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.018"
            material="color: #ffffff; shader: flat"
            raycaster="objects: .clickable">
          </a-cursor>
        </a-camera>

        <!-- Left Hand Tracking (Stationary / Gesture / Raycast) -->
        <a-entity 
          id="leftHand" 
          hand-tracking-controls="hand: left"
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 5">
        </a-entity>

        <!-- Right Hand Tracking (Stationary / Gesture / Raycast) -->
        <a-entity 
          id="rightHand" 
          hand-tracking-controls="hand: right"
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 5">
        </a-entity>
      </a-entity>

      <!-- Stationary Fishing Anchor (Positioned on the floor directly in front of the player) -->
      <a-entity id="fishing-station" position="0 0 -1.5">
        <!-- 3D Fishing Hole Model -->
        <a-entity 
          id="fishingHole" 
          gltf-model="#fishingHoleModel" 
          position="0 0.01 0">
        </a-entity>

        <!-- Fallback / Interactive Fishing Water Surface -->
        <a-circle 
          id="waterSurface"
          class="clickable"
          fishing-spot
          rotation="-90 0 0" 
          radius="0.6" 
          material="color: #0284c7; opacity: 0.85; transparent: true; roughness: 0.2">
        </a-circle>
      </a-entity>

      <!-- Lighting -->
      <a-light type="ambient" intensity="0.8" color="#ffffff"></a-light>
      <a-light type="directional" intensity="0.5" position="1 4 2"></a-light>
    </a-scene>
  </body>
</html>
