<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Stationary WebXR Scene</title>
    <meta name="description" content="Fixed-position VR environment">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene webxr="referenceSpaceType: local-floor">
      
      <a-assets>
        </a-assets>

      <a-entity id="rig" position="0 0 0">
        <a-camera 
          id="head" 
          look-controls="pointerLockEnabled: false" 
          wasd-controls="enabled: false">
          <a-cursor 
            geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
            material="color: #FFF; shader: flat"
            position="0 0 -1">
          </a-cursor>
        </a-camera>

        <a-entity 
          id="leftHand" 
          hand-tracking-controls="hand: left"
          laser-controls="hand: left"
          raycaster="objects: .collidable">
        </a-entity>

        <a-entity 
          id="rightHand" 
          hand-tracking-controls="hand: right"
          laser-controls="hand: right"
          raycaster="objects: .collidable">
        </a-entity>
      </a-entity>

      <a-sky color="#1A1A24"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#333344"></a-plane>

      <a-entity id="play-area" position="0 1 -1.2">
        <a-box 
          class="collidable"
          position="0 0.2 0" 
          scale="0.4 0.4 0.4" 
          color="#4CC3D9" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        </a-box>

        <a-cylinder 
          position="0 -0.4 0" 
          radius="0.5" 
          height="0.8" 
          color="#222233">
        </a-cylinder>
      </a-entity>

      <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.6" position="-1 3 1"></a-light>

    </a-scene>
  </body>
</html>
